    path: "./ruleset/net-routing/AppleCNCDN.txt"

  # ---- 广告拦截 ----
  # lite 只留主集与自托管集。删掉的 4 本：
  #   Reject_domainset      约 10.9 万条广告域名，behavior 必须是 domain。
  #                         上游 payload 里 108241 条是 "+.域名" 简写、0 条带逗号；
  #                         classical 会把整份规则集解析失败并丢弃
  #                         （日志里十万条 missing subsequent parameters，广告拦截实际为空）。
  #                         "+.域名" 是 mihomo 合法写法：
  #                         component/trie/domain.go 的 ValidAndSplitDomain 明确接受
  #                         "+.example.com"，且 DomainSetBuilder 会同时插入后缀与全匹配两条。
  #                         ⚠️ 删它是 lite 单项最大收益（体积与更新流量），
  #                            也是最大漏拦风险。
  #   Reject_no_ip_drop / Reject_no_ip_no_drop / Reject_ip —— 与主集互补的三个细分集。
  #     想加回时按上面的 behavior 逐本恢复，规则链位置见段 2。
  Reject_no_ip:
