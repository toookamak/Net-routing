# ============================================================================
#  net-routing-lite.conf —— OpenClash 覆写模块（INI 格式）· lite 产物
#
#  部署：LuCI → 服务 → OpenClash → 覆写模块 → 上传此文件（.txt / .conf 后缀）
#        上传后在模块列表里把「启用」打开。
#
#  ⚠️⚠️ 本文件与 targets/openclash-override-1002.conf（全量）**不能同时启用**。
#     两者都是 [YAML] 块，OpenClash 会做重复合并而不是覆盖，结果不可预期。
#     切换时请先停用全量模块并重载，再启用本模块；
#     回退办法：停用本模块、重新启用全量模块、重载。
#     覆写模块从 GitHub 拉取，git push 即等于生产部署 —— 改本文件请当成上线操作。
#
#  为什么用覆写模块而不是自定义覆写脚本：
#    覆写模块是 OpenClash 官方支持的声明式覆写，[YAML] 块提供合并算子
#    （key! 强制覆盖 / key+ 数组追加 / key- 删键 / key* 条件更新），
#    不需要写 Ruby，也就没有 2>/dev/null 吞错误、引号嵌套、psych 转义
#    这些坑。它在启动流程第 ③ 步执行（yml_rules_change.sh 之后），
#    天然绕开了自定义规则的「目标组不存在就静默丢弃」那个陷阱。
#
#  规模：22 条分流规则 / 13 个规则集 / 11 个策略组
#    （全量是 52 条 / 43 个 / 22 个；裁剪白名单见 rules/profile-lite-openclash.yaml）
#  内容版本：v1.1.0    文件大版本：1015（2026-10-15，立项日期）
#    ↑ 本行每次改动本文件都要递增，用来确认路由器上部署的是哪一版：
#      覆写模块编辑框第一屏可见，也可 grep -n 'net-routing artifact' /tmp/yaml_overwrite.sh
#      文件名末尾的 1015 是大版本，只在重大结构调整时另存新文件。
#
#  ── lite 相对全量删掉了什么（一句话版）──────────────────────────────
#    6 个地区组收窄成 4 个（删英国、台湾）→ 22 组变 11 组
#    删「家宽/低倍率/流媒体/订阅信息」四个线路特性组
#    删「办公通讯/谷歌服务/游戏平台/大流量通道/兜底代理」五个服务组
#    整段删掉段 8 谷歌 / 段 9 大流量 / 段 10 游戏，
#    另在段 2、段 4、段 6 各删掉一部分
#    兜底 MATCH 直接投「🧭 代理模式」，不再经「🌍 兜底代理」中转
#    详见 rules/profile-lite-openclash.yaml 与 targets/openclash-override-lite-1015.md
#
#  ── 合并语义速查（来自 OpenClash 官方 default 文件）─────────────────
#    key      默认合并，Hash 递归合并，其他类型直接覆盖
#    key!     强制覆盖整个值（不做递归）
#    key+     数组后置追加          +key      数组前置插入
#    key-     数组差集删除 / 非数组则删除该键（值为空或 ~）
#    key*     批量条件更新，配合 where / set 子句
#
#  ── 本文件不做的事 ─────────────────────────────────────────────────
#    ✗ 碰 proxies / 端口 / authentication / dns.listen
#    ✗ 改 IPv6 —— 那是系统层问题，见 targets/openclash-override-1002.md 第九节
#
#  ── 排错 ───────────────────────────────────────────────────────────
#    OpenClash 会把本文件编译成 /tmp/yaml_overwrite.sh，可直接查看编译结果：
#        cat /tmp/yaml_overwrite.sh
#    运行日志：/tmp/openclash.log
#
#    ⚠️ 最常见的加载失败原因是「规则或组的选项指向了不存在的组」
#       （log 里是 ProxyGroup not found / ProxyGroup loop）。本文件删了 11 个组，
#       所有引用都已同步清理；手工改本文件后请务必再核一遍
#       rules/profile-lite-openclash.yaml 的 reference_fixups 一节。
# ============================================================================

[General]
CORE_TYPE = Meta

# 不自动重启。改完模块后在界面上手动重启 OpenClash，便于先看编译结果
RESTART = false

# off：规则链里已经没有进程规则，让内核完全不查进程（官方对路由器推荐值）。
# v1.0.0 曾为段 3 的 PROCESS-NAME,tailscaled 改成 strict，v1.1.0 回退掉了：
# 那条规则想解决 tailscaled 自己发出的 UDP 打洞流量，但 TPROXY 接管之后
# 「链内规则（含进程规则）能否把它救回来」并不可靠，已改为在防火墙层
# 前置放行 —— 原理、实测脚本与判定命令见配套文档
# 「已知问题 10 · Tailscale 的 UDP 打洞」。
# ⚠️ 如果日后手工加回任何 PROCESS-NAME 规则，本行必须同时改回 strict，
#    否则那些规则会静默不命中。官方说明进程规则 "Only Works on Routerself"。
FIND_PROCESS_MODE = off

# 13 个规则集大多来自 raw.githubusercontent.com，大陆直连经常超时。
# 开启后 OpenClash 会把 provider URL 自动重写成 CDN 地址。
# 需要关掉的话改成 0
GITHUB_ADDRESS_MOD = https://cdn.jsdelivr.net/

# 域名嗅探。官方说明 "Sniffer Will Prevent Domain Name Proxy and DNS Hijack Failure"。
# fake-ip 下大部分连接本来就有域名信息，但 homelab 机器之间不少是直连 IP
# 的（NAS 挂载、数据库直连、CI 拉镜像），这些走不到 fake-ip 映射，
# 嗅探能把域名捞回来。
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

# 大陆 IP 列表与 GeoIP/GeoSite 库的自动更新。
# ⚠️ 这三项是**定时任务读 UCI**，不是生成期覆盖 —— 写在这里不一定生效，
#    保险做法是同时在 LuCI 界面或用 uci 命令设置（见配套文档第十节）。
CHNR_AUTO_UPDATE = 1
CHNR_UPDATE_WEEK_TIME = *
CHNR_UPDATE_DAY_TIME = 6
GEOIP_AUTO_UPDATE = 1
GEOIP_UPDATE_WEEK_TIME = *
GEOIP_UPDATE_DAY_TIME = 5
GEOSITE_AUTO_UPDATE = 1
GEOSITE_UPDATE_WEEK_TIME = *
GEOSITE_UPDATE_DAY_TIME = 5

#  net-routing artifact: 1015 lite v1.1.0
#  ↑ 版本标记。部署后在覆写模块编辑框第一屏就能看到；
#    也能在编译产物里 grep：grep -n 'net-routing artifact' /tmp/yaml_overwrite.sh
#
[YAML]

# ── 顶层键（默认合并）────────────────────────────────────────────────
mode: rule
unified-delay: true
tcp-concurrent: true
geodata-mode: true

# ── DNS ─────────────────────────────────────────────────────────────
# 修掉订阅自带的两个问题：
#   1. fallback: [1.1.1.1, 8.8.8.8] 从大陆直连必然被污染/超时，
#      而 fallback-filter 配了 geosite:gfw，gfw 域名的查询全撞在它上面
#   2. respect-rules: false 导致 DNS 连接不走代理，国际 DoH 穿不过隧道
#
# 下面 listen / enhanced-mode / fake-ip-range / use-hosts 保持 OpenClash 原值，
# 本文件不碰 —— listen 必须与 dnsmasq 的转发配置对得上。
dns:
  respect-rules: true
  ipv6: false
  # 删掉坏掉的 fallback（值为空即删键）
  fallback-:
  fallback-filter-:
  # 引导层：只用来解析下面两个 DoH 的域名，必须明文直连可达
  default-nameserver!:
    - '223.5.5.5'
    - '119.29.29.29'
  # 国内 DoH，实测 alidns 175ms / doh.pub 189ms
  nameserver!:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'
  # 节点自身域名的解析源，单独隔离。机场节点域名被污染就永远连不上，
  # 路由器是全家入口，这条比客户端更要命
  proxy-server-nameserver!:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'
  # 境外域名走国际 DoH。respect-rules=true 时这些连接会穿隧道
  # （实测 dns.google 317ms 返回 200，走代理；直连不可能这个结果）
  nameserver-policy:
    'geosite:gfw,geolocation-!cn':
      - 'https://dns.google/dns-query'
      - 'https://cloudflare-dns.com/dns-query'
  # 追加而非替换 —— OpenClash 注入的 rule-set:oc-cn-domain 会保留，
  # 中国大陆域名继续走 fake-ip，不会因为加这些而全部退回真实解析。
  #
  # 覆盖：局域网广播发现 / Tailscale MagicDNS / 系统连通性检测 /
  #       NTP / IoT 智能家居 / 银行支付
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.home'
    - '+.home.arpa'
    - '+.internal'
    - '+.intranet'
    - '+.private'
    - '+.arpa'
    - '+.ts.net'
    - 'connectivitycheck.gstatic.com'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.gvt1.com'
    - '*.gvt2.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.mi.com'
    - '*.xiaomi.com'
    - '*.hp.com'
    - '*.brother.com'
    - '*.epson.net'
    - '*.esphome.io'
    - '*.homeassistant.io'
    - '+.oray.com'
    - '+.sunlogin.net'
    - '+.icbc.com.cn'
    - '+.ccb.com'
    - '+.abchina.com'
    - '+.alipay.com'
    - '+.unionpay.com'


# ============================================================================
# proxy-groups —— 11 个组（全量 22 个）
#
# ⚠️⚠️ 下面的 filter / exclude-filter 必须写成「单引号 + 单个正则」，
#    绝不能出现 | 反引号 $ \ 这些字符。原因（2026-10-02 实测确认）：
#
#    OpenClash 0.47.156 拼 [YAML] 块时逐行执行
#        yaml_content="${yaml_content}$(eval "echo \"$line\"")"$'\n'
#    行里的双引号会提前闭合 shell 的引号，后面的 | 变成管道运算符，
#    echo 的输出被灌进管道，命令替换拿到空串 —— **整行被静默删除**。
#    实测：filter: "HK|Hong Kong|abc" 过这个表达式后变成空字符串。
#    后果就是日志无任何报错、组还在、但 filter 键凭空消失，
#    所有地区组退化成「全部节点」，选香港会连到新加坡。
#
#    单引号在 shell 双引号串里是字面量，能原样通过 eval（已实测）。
#    所以本段所有正则一律用单引号，且一个组只能给一个正则。
#
#    ⚠️ 单正则还意味着**只能用简短文字，不能用符号**（2026-10-02 定的方向）：
#       换订阅是常态，各家命名风格不同，但「香港 / 剩余」这种词是通用的；
#       emoji、全角冒号、连字符只有那一家在用，符号越多能匹配的代理商越少。
#       本段已全部去掉旗帜 emoji 与 '：'，只用文字。
#
#    ⚠️ lite 删掉了「家宽」「低倍率」「流媒体」三个 filter，本段只剩
#       四个地区 filter 与一个 exclude-filter。全量的命中率实测
#       （2026-10-02，51 节点）在 lite 里仍然适用的部分：
#         '香港' 5   '新加坡' 12  '日本' 15  '美国' 12
#         '剩余' —— 通知节点（剩余流量：/剩余天数：/距离下次重置剩余：）的共同特征
#       换订阅后必须重新核对这四个地区词的命中率；
#       tools/check-node-match.mjs 可以对新节点名核一次。
#
#    ⚠️ 已删除的三个 filter 的实测命中（留档，将来加回时参考）：
#         '英国' 4   '台湾' 1   '流媒体' 18   '[0-9]x' 18   '家宽' 0
# ============================================================================

proxy-groups!:

  # ---- 核心路由 ----

  - name: "🧭 代理模式"
    type: select
    # 顶层唯一入口。日常只需要碰这一个组。
    # ⚠️ 全量在这里的第 10 项是 REJECT，lite 已删除：兜底 MATCH 跟随本组，
    #    顶层误选 REJECT 会让全部兜底流量被拒（断网级）。
    #    同理删除了「🇬🇧 英国」「🇹🇼 台湾」两项（目标组已删）。
    proxies:
      - "⚡ 延迟优选"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🇯🇵 日本"
      - "🇺🇸 美国"
      - "🚧 故障转移"
      - "🌍 全部节点"
      - "DIRECT"

  - name: "⚡ 延迟优选"
    type: url-test
    include-all-proxies: true
    # 通知节点绝不能参与测速——它们是流量/到期提示，不是线路
    # 用「剩余」这个短词而不是全角冒号：冒号只对用全角冒号命名的那家有效
    exclude-filter: '剩余'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    # 路由器比客户端更需要容差：服务器上的长连接（docker pull / rsync /
    # 数据库同步）经不起一次中途切换导致的 TCP 重连。
    tolerance: 50
    lazy: true

  - name: "🚧 故障转移"
    type: fallback
    include-all-proxies: true
    exclude-filter: '剩余'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    lazy: true

  - name: "🌍 全部节点"
    type: select
    include-all-proxies: true
    exclude-filter: '剩余'
    empty-fallback: DIRECT
    # 注意：本组不设 filter，因此也会包含「未命中任何地区」的节点。
    # flclash 版有个「🌐 其他地区」组用来兜这些节点，路由器上做不出来——
    # 正则无法表达「不匹配上述任何地区」（Go RE2 不支持否定前瞻）。
    #
    # ⚠️ lite 把地区组收窄到四个（删了英国、台湾），这个缺口因此比全量更明显：
    #    英/台/韩/德等非四大地区的节点只能在本组里手选，
    #    没有「在这些节点里自动挑延迟最低」的入口。
    #    （FlClash lite 用「🌐 其他地区」补上了这一点；
    #      路由器侧若要补，可用 include-all-proxies + exclude-filter 的
    #      排除式正则实现，但需要一份覆盖全部地区写法的关键词表，
    #      漏词会让节点同时出现在两个组里 —— 未实测，本产物不做。）
    # 这些节点在本组里仍然可选。

  # ---- 地区组：选地区 = 该地区内延迟最低的那个 ----
  # 正则来自 rules/regions.yaml，一行都不写死
  # lite 保留四个地区（HK / JP / US / SG），与 rules/profile-lite.yaml 的
  # regions.keep 一致

  - name: "🇭🇰 香港"
    type: url-test
    include-all-proxies: true
    filter: '香港'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 50
    lazy: true

  - name: "🇸🇬 新加坡"
    type: url-test
    include-all-proxies: true
    filter: '新加坡'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 50
    lazy: true

  - name: "🇯🇵 日本"
    type: url-test
    include-all-proxies: true
    filter: '日本'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 50
    lazy: true

  - name: "🇺🇸 美国"
    type: url-test
    include-all-proxies: true
    filter: '美国'
    empty-fallback: DIRECT
    url: "http://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 50
    lazy: true

  # ---- 服务组 ----
  # lite 只保留 AI 与广告拦截两个服务组。
  # 全量还有 📁 办公通讯 / 🔍 谷歌服务 / 游戏平台 / 📺 大流量通道 四个，
  # 它们的流量在 lite 里落到 MATCH → 仍走代理，只失去「单独换出口」的可调性。
  # 路由器版尤其重要：homelab 机器没人去面板上点，服务分组必须自己兜住。

  - name: "🤖 AI服务"
    type: select
    proxies: ["🧭 代理模式", "⚡ 延迟优选", "🚧 故障转移", "🌍 全部节点", "DIRECT", "REJECT"]
    # 本组接的是固定几个 AI 域名，不接兜底流量，误选 REJECT 不构成断网

  - name: "⛔ 广告拦截"
    type: select
    # 固定两项，不可选其他出口
    proxies: ["REJECT", "DIRECT"]
    # 路由器版的广告拦截是 homelab 机器唯一的防线
    #（NAS / PVE / CI 上装不了 FlClash）
    # ⚠️ lite 删掉了本组引用的 4 本规则集（Reject_domainset /
    #    Reject_no_ip_drop / Reject_no_ip_no_drop / Reject_ip），
    #    规则链上只剩 Reject_no_ip 与 CustomRejectRules 两条 ——
    #    漏拦会比全量明显增加。这是 lite 已知的、也是最实质的代价。

  # ---- 默认路由 ----

  - name: "🛡️ 国内直连"
    type: select
    # 默认 DIRECT。接入第 22 条 GEOIP,CN
    # ⚠️ 全量在这里有「🇬🇧 英国」「🇹🇼 台湾」两项，lite 已删除（目标组已删）。
    proxies:
      - "DIRECT"
      - "⚡ 延迟优选"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🇯🇵 日本"
      - "🇺🇸 美国"
      - "🚧 故障转移"
      - "🌍 全部节点"


# ============================================================================
# rule-providers —— 合并进已有的（保留 OpenClash 注入的 oc-cn-domain）
#
# 13 本（全量 43 本）。保留的就是与 FlClash lite 相同的那 13 本 ——
# 全量里 OpenClash 本就比 FlClash 少的 3 本（applications / Telegram_no_ip /
# GoogleFCM_no_ip）恰好全在删除清单内，所以两端各删掉自己的份额之后剩下的完全一致。
# 完整清单与删除理由见 rules/profile-lite-openclash.yaml。
#
# 相比 flclash 版全量少了 3 个（这一条 lite 沿用全量的既有取舍）：
#   applications        —— 全是 PROCESS-NAME，路由器上对 LAN 客户端永不命中
#                          （官方源码："Only Works on Routerself"）
#   Telegram_no_ip      —— 与 Telegram_ip 同 url 同 path，功能完全重复。
#                          FlClash 有「Provider Path Mapping」把 path 重映射成
#                          哈希路径把这个 bug 掩盖了，**OpenClash 尊重声明的
#                          path**，两个 provider 会竞争写同一个文件。
#   GoogleFCM_no_ip     —— 同上
# 这两条是 docs/openclash.md 第五节实测确认的，路由器上真的会触发。
# ============================================================================

rule-providers:

  # ---- 免拦截 / 直连 ----
  UnBan:
    type: http
    behavior: classical
    format: text
    interval: 172800
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list"
    path: "./ruleset/net-routing/UnBan.list"
  DirectNoResolve:
    type: http
    behavior: classical
    format: yaml
    interval: 172800
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.yaml"
    path: "./ruleset/net-routing/Direct.yaml"
  Lan_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 172800
    url: "https://raw.githubusercontent.com/RealSeek/Clash_Rule_DIY/refs/heads/mihomo/DIRECT/ip/Lan_ip.yaml"
    path: "./ruleset/net-routing/Lan_ip.yaml"
  Domestic_no_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 172800
    url: "https://raw.githubusercontent.com/RealSeek/Clash_Rule_DIY/refs/heads/mihomo/DIRECT/no_ip/Domestic_no_ip.yaml"
    path: "./ruleset/net-routing/Domestic_no_ip.yaml"
  MicrosoftCNCDN_no_ip:
    type: http
    behavior: classical
    format: text
    interval: 172800
    url: "https://ruleset.skk.moe/Clash/non_ip/microsoft_cdn.txt"
    path: "./ruleset/net-routing/MicrosoftCNCDN.txt"
  AppleCNCDN_no_ip:
    type: http
    behavior: domain
