# ============================================================================
# rules —— 整体替换（22 条，全量 52 条）
#
# mihomo 从上到下匹配，命中即停。三个不可动的顺序约束：
#   ① 第 1-2 条 UnBan 必须在所有 REJECT 之前，否则白名单形同虚设
#   ② 第 5-7 条 tailnet 必须在 GEOSITE,cn / GEOIP,CN 之前，
#      否则 homelab 机器间互访会被「国内直连」抢走
#   ③ 最后两条必须是 GEOIP,CN 和 MATCH
#
# ⚠️ no-resolve 的位置：必须在目标组之后。
#      IP-CIDR,100.64.0.0/10,DIRECT,no-resolve  ✅
#      IP-CIDR,100.64.0.0/10,no-resolve,DIRECT  ❌ 报 proxy [no-resolve] not found
#
# ⚠️ lite 删掉的段（与删组配对，见 rules/profile-lite-openclash.yaml）：
#      段 8  · 谷歌服务    3 条 → 删
#      段 9  · 大流量通道  7 条 → 删（含 3 个 domainset 大集）
#      段 10 · 游戏平台    5 条 → 删
#      段 2  · 广告拦截    6 条 → 留 2 条
#      段 4  · 私有网络    8 条 → 留 7 条（去 SteamCN_ip）
#      段 6  · 办公通讯   11 条 → 留 1 条（CustomProxyRules，改投 🧭 代理模式）
# ============================================================================

rules!:

  # ── 段 1 · 免拦截白名单（1-2）→ DIRECT ──────────────────────────
  # 必须最先。误伤广告规则的代价（装不上、登不进）远大于漏放几个广告。
  - "RULE-SET,UnBan,DIRECT"
  - "RULE-SET,DirectNoResolve,DIRECT"

  # ── 段 2 · 广告拦截（3-4）→ ⛔ 广告拦截 ────────────────────────
  # homelab 机器唯一的广告防线（NAS / PVE / CI 上装不了 FlClash）
  # ⚠️ lite 只剩这两条，全量的另外 4 条（Reject_domainset 等）已删 ——
  #    漏拦会增加，这是 lite 最实质的代价，见产品文档「取舍」一节。
  - "RULE-SET,Reject_no_ip,⛔ 广告拦截"
  - "RULE-SET,CustomRejectRules,⛔ 广告拦截"

  # ── 段 3 · tailnet 内网 / Tailscale 域名（5-7）→ DIRECT ─────────
  # ⚠️ 路由器版与 flclash 版的唯一结构差异：目标直接是 DIRECT，不建策略组。
  #    tailscaled 是系统服务，tailnet 路由由它自己处理（ip rule → table 52），
  #    mihomo 再插一层只会添乱。
  #    刚需理由：tailnet 里有 fnos(NAS) / nas6418 / pve，homelab 机器之间
  #    要互访，走代理就断了。
  # ⚠️ v1.1.0 删掉了原本的第 5 条 `PROCESS-NAME,tailscaled,DIRECT`（配
  #    [General] FIND_PROCESS_MODE = strict）。它想接住的是 tailscaled 自己
  #    发出的 **UDP**：STUN(3478) 与打洞(41641) 发往任意对端 IP，没有域名可
  #    匹配，默认被兜底代理接走 → P2P 打洞失败、只剩中继；而中继节点都在
  #    中国大陆之外（最近是香港/东京），这正是「访问家里设备绕路国外」的
  #    主因。
  #    删掉它的理由是**这条路的位置不对**：OpenClash 混合模式靠 iptables
  #    TPROXY 接管 UDP，流量进入 openclash 链时已被内核接管，在链内做处理
  #    （无论进程规则还是链内放行）都不一定救得回来，且进程规则只对路由器
  #    自身有效。正确做法是在 **PREROUTING / OUTPUT 的 TPROXY 之前**直接
  #    RETURN，让 tailnet 流量根本不进 OpenClash 链 —— 可照抄的实测脚本与
  #    判定命令见配套文档「已知问题 10」。
  #    在完成那一步之前，本段只剩 3 条，UDP 打洞回到「只有 TCP 协调/中继
  #    直连」的旧状态，即打洞仍可能走中继。
  # ⚠️ 第 5-7 条是 tailnet 自身地址：CGNAT 段、MagicDNS 解析器与 *.ts.net。
  # ⚠️ Tailscale 的**服务端域名**（controlplane / login / api / derpN / pkgs /
  #    log）不在这里，而是走自托管规则集：rulesets/OwnDIRECTRules.yaml →
  #    provider CustomDirectRules → 第 15 条。放规则集是为了两个产物共用同一
  #    份名单、以后增删域名不用重新上机。
  #    它只覆盖 TCP 侧（协调 / 登录 / 中继）：域名命中的前提是「连接带着域名
  #    进来」，客户端经 mihomo DNS 拿到 fake-ip 的情形天然满足（含 LAN 客户端
  #    与路由器自身）；只有直接以 IP 发起的连接才依赖嗅探还原 SNI，而 PURE_IP
  #    嗅探已开（⚠️ 尚未实测）。解析侧也安全：tailscale.com 属 geolocation-!cn，
  #    nameserver-policy 已把它交给国际 DoH，不会拿到被污染的 IP。
  # ⚠️ 顺序：域名规则落在第 15 条，晚于第 12 条 GEOSITE,cn；段 4 的目标全是
  #    DIRECT，两者功能等价，不需要为顺序挪动。
  # ⚠️ 与 flclash lite 的差异：这里只有 3 条，没有 PROCESS-NAME,tailscaled.exe
  #    —— 路由器是 OpenWrt / Linux，不存在 .exe。
  - "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"
  - "IP-CIDR,100.100.100.100/32,DIRECT,no-resolve"
  - "DOMAIN-SUFFIX,ts.net,DIRECT"

  # ── 段 4 · 私有网络与国内直连（8-14）→ DIRECT ─────────────────
  # lite 相对全量去掉了 SteamCN_ip（8 条变 7 条）。Steam 国区 IP 在 lite 里
  # 落到 MATCH → 走代理；若发现国区商店变慢，把这条加回段 4 末尾即可。
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "RULE-SET,MicrosoftCNCDN_no_ip,DIRECT"
  - "RULE-SET,AppleCNCDN_no_ip,DIRECT"
  - "GEOSITE,cn,DIRECT"
  - "RULE-SET,Lan_ip,DIRECT"
  - "RULE-SET,Domestic_no_ip,DIRECT"

  # ── 段 5 · 自定义直连（15）→ DIRECT，锁死不建组 ─────────────────
  - "RULE-SET,CustomDirectRules,DIRECT"

  # ⚠️ flclash 版这里的「段 5 · 应用级分流（PROCESS-NAME）」已删除。
  #    那条规则依赖 PROCESS-NAME，路由器上对 LAN 客户端永不命中
  #    （官方源码原话："Only Works on Routerself"）。
  #    路由器版不做按设备分流 —— homelab 机器的流量特征由服务组覆盖，
  #    不靠客户端那种进程规则。

  # ── 段 6 · 自定义代理（16）→ 🧭 代理模式 ───────────────────────
  # 全量产物这一条是「段 6 · 办公通讯与开发工具链」的最后一条，投 📁 办公通讯。
  # lite 删掉了 📁 办公通讯 组，改投顶层「🧭 代理模式」（默认「⚡ 延迟优选」）。
  # ⚠️ 该组默认首项就是「🧭 代理模式」，所以这个改动**不改变当前行为**；
  #    失去的是可调性：把 📁 办公通讯 切 DIRECT 让 docker pull / git clone
  #    直连的动作不再可用。全量该段另外 10 条（Github / Docker / Npm /
  #    Telegram_ip / Microsoft_no_ip / OneDrive / Dropbox / Twitter /
  #    Notion_ip / Figma_ip）已删，这些流量落到 MATCH → 仍走代理。
  - "RULE-SET,CustomProxyRules,🧭 代理模式"

  # ── 段 7 · AI 服务（17-19）→ 🤖 AI服务 ─────────────────────────
  - "RULE-SET,OpenAI,🤖 AI服务"
  - "RULE-SET,AI_no_ip,🤖 AI服务"
  - "RULE-SET,Gemini,🤖 AI服务"

  # ⚠️ 全量段 8（谷歌服务）、段 9（大流量通道）、段 10（游戏平台）在此处已删，
  #    合计 15 条。这些流量落到 MATCH → 仍走代理，只失去「单独换出口」的可调性。
  #    其中段 9 含 3 个 domainset 大集（CDN / Download / Reject 之外的），
  #    是体积与更新流量的主要来源 —— 删它同时是 lite 提速的主要原因。
  #    代价：下载类流量回落到 MATCH 走代理，可能跑满代理带宽。

  # ── 段 11 · 单主机 UDP 直连例外（20）→ DIRECT ─────────────────
  # 只为 192.168.31.7（LAN 上的常用终端）加：它自己的 Tailscale UDP 打洞
  # （STUN 3478、WireGuard/DISCO 发往对端公网 IP）目标与端口都不固定，
  # 按域名和单端口都抓不全，所以整机 UDP 放行。
  # 为什么不能像路由器那样用进程规则：LAN 客户端的进程在路由器上查不到
  # （官方说明 "Only Works on Routerself"），只能用「来源 IP」近似。
  # 路由器自身的 UDP 打洞改由防火墙层前置放行（见段 3 注释与配套文档
  # 「已知问题 10」），不再依赖任何进程规则。
  # ⚠️ 代价：该主机的**所有** UDP 都直连 —— QUIC/HTTP3、游戏、其他 UDP
  #    全部绕开代理，这个主机不再有「防泄露」可言。若哪天想堵住 QUIC，
  #    在本条之前加：
  #      AND,((NETWORK,udp),(SRC-IP-CIDR,192.168.31.7/32),(DST-PORT,443)),REJECT
  #    （QUIC 被拒后浏览器会回落到 TCP 走代理）；不需要这条例外时，整段删掉。
  # ⚠️ 位置：必须排在兜底之前，因为 GEOIP,CN 与 MATCH 必须是最后两条；
  #    对该主机发往国内 IP 的 UDP 也先命中这里，结果与 GEOIP,CN 一致。
  # ⚠️ 这是 OpenClash 独有的一段，FlClash lite 没有对应内容。lite 保留它，
  #    理由见 rules/profile-lite-openclash.yaml 的 sections.udp-exception。
  - "AND,((NETWORK,udp),(SRC-IP-CIDR,192.168.31.7/32)),DIRECT"

  # ── 段 12 · 兜底（21-22） ──────────────────────────────────────
  # 这两条必须是最后两条。提前会让后面所有规则永不生效。
  - "GEOIP,CN,🛡️ 国内直连"
  # ⚠️ 全量这里投「🌍 兜底代理」（默认跟随「🧭 代理模式」），
  #    lite 删掉中间组，直接指向「🧭 代理模式」（默认「⚡ 延迟优选」）。
  #    理由与 FlClash 侧一致：多一层 select 只是多一个能点错的地方。
  - "MATCH,🧭 代理模式"
