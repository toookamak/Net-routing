# OwnDIRECTRules —— 个人自定义「直连」规则
#
# 作用：命中这里的流量强制走 DIRECT（不经过代理节点）。
# 生效位置：见 rules/priorities.yaml 的 custom-direct 段 —— 排在「广告拦截」之后、
#          「国内直连」之前，优先级相当高。填错了会直接压过后面所有规则。
# 格式：YAML + payload 数组，一行一条 mihomo classical 规则。
#
# 💡 小提示
#    本目录随仓库一起公开。如果某条规则涉及不希望公开的信息（内网域名、
#    内部服务地址等），可以考虑把仓库改为 Private，或把该条规则改写到
#    rules/inline-rules.yaml —— 内嵌规则不依赖外部地址，不会被单独拉取。
#
# ---------------------------------------------------------------------------
# 怎么用：删掉下方示例的「#」并改成你自己的域名，然后保存提交即可。
#          客户端在 24 小时内自动拉取（interval: 86400），也可以手动刷新规则集。
#
# 下面所有示例都用了 example.com / example.net —— 这是 RFC 2606 保留域名，
# 不对应任何真实网站，所以默认全注释掉不会误伤任何流量。
# ---------------------------------------------------------------------------

# ⚠️ 下面这行必须保持 `[]`，它代表「空列表」。
#    填规则时改成下面这样（注意缩进 2 空格，减号前有空格）：
#      payload:
#        - DOMAIN-SUFFIX,yoursite.com
#
# 飞牛 fnOS（NAS 系统）及其 FN Connect 远程访问服务
#
# 实测域名解析均为阿里云境内节点（106.15.42.56 / 47.101.149.170），
# 且当前已由 GEOSITE,cn 覆盖、本来就走直连（实测 total 0.18~0.20s，
# 与走代理无差异）。这里显式写一遍是**加固而非修复**：
#   · 免得日后 geosite 数据变更导致它掉出 cn 组；
#   · 明确「NAS 相关一律不消耗代理流量」这一意图。
#
# fnos.net  是 FN Connect 服务端（远程访问、DDNS、FN ID 登录）
# fnnas.com 是官网与静态资源（static2.fnnas.com 承载前端 JS/CSS/图标）
payload:
  - DOMAIN-SUFFIX,fnos.net
  - DOMAIN-SUFFIX,fnnas.com

  # RayLink 远程控制
  #
  # 域名不是从官网抄的（本机 DNS 走 fake-ip，查不出来），是从客户端自己的日志里
  # 扒出来的真实连接目标：
  #   %ProgramData%\RayLink\service_config.json → api. / ws.raysync.cloud
  #   %ProgramData%\RayLink\debug_0_*.log       → relay.raysync.cloud:443   （TCP 中继）
  #                                              raylink-root.raysync.cloud（SDN 根节点）
  #                                              stun.raylink.live          （自建 STUN）
  #                                              minio-api.raylink.live     （图片/活动资源）
  #   %ProgramData%\RayLink\license_0.log       → fly.cloudtalkers.com      （授权/登录）
  #
  # raysync 是 RayLink 自研传输协议的云服务；官网 www.raylink.live 只是下载页，
  # 真正跑远控画面、文件传输、语音的是 *.raysync.cloud。走代理纯属白吃流量。
  - DOMAIN-SUFFIX,raysync.cloud
  - DOMAIN-SUFFIX,raylink.live
  # 授权服务器是第三方 SDK 提供的，这里只出现 fly. 一个子域，
  # 所以用精确匹配，不整个吃掉 cloudtalkers.com（该域可能有别的产品共用）
  - DOMAIN,fly.cloudtalkers.com
  #
  # 刻意不加的：
  #   qq.com / qlogo.cn  微信登录的第三方，已被 GEOSITE,cn 覆盖
  #   www.qingjiaocloud.com  客户端内活动 banner 的落地页，不参与远控链路

  # ---------------------------------------------------------------------
  # ① 域名后缀：匹配 example.com 及其所有子域名
  #    适合：整个站点（含所有子域）都该直连
  # ---------------------------------------------------------------------
  # - DOMAIN-SUFFIX,example.com

  # ---------------------------------------------------------------------
  # ② 域名精确匹配：只匹配这一个主机名，不含子域
  #    适合：只让某个 API 端点直连，站点其余部分仍走代理
  # ---------------------------------------------------------------------
  # - DOMAIN,api.example.net

  # ---------------------------------------------------------------------
  # ③ 关键字匹配：域名中「包含」该关键字即命中
  #    ⚠️ 杀伤力最大，容易误伤。优先用 ① ②，确有需要再用这个。
  # ---------------------------------------------------------------------
  # - DOMAIN-KEYWORD,intranet

  # ---------------------------------------------------------------------
  # ④ IP 段：匹配目标 IP
  #    no-resolve 表示「不为此规则触发 DNS 解析」，可减少 DNS 请求与泄漏面。
  #    ⚠️ 填公网 IP 前先确认：写错会静默失配，且换 IP 后规则立刻失效。
  # ---------------------------------------------------------------------
  # - IP-CIDR,203.0.113.0/24,no-resolve

  # ---------------------------------------------------------------------
  # ⑤ 进程匹配：只对指定程序的流量生效
  #    ⚠️ 仅在 Windows / macOS 桌面端有效，Android / iOS 不支持。
  #    ⚠️ 需客户端开启「查找进程」，且会明显增加 CPU 开销。
  # ---------------------------------------------------------------------
  # - PROCESS-NAME,MyPrivateApp.exe
