# OwnDIRECTRules —— 个人自定义「直连」规则
#
# 作用：命中这里的流量强制走 DIRECT（不经过代理节点）。
# 生效位置：见 rules/priorities.yaml 的 custom-direct 段 —— 排在「广告拦截」之后、
#          「国内直连」之前，优先级相当高。填错了会直接压过后面所有规则。
# 格式：YAML + payload 数组，一行一条 mihomo classical 规则。
#
# 💡 小提示
#    本目录随仓库一起公开。如果某条规则涉及不希望公开的信息（内网域名、
#    内部服务地址等），可以考虑把仓库改为 Private，或把该条规则改写到
#    rules/inline-rules.yaml —— 内嵌规则不依赖外部地址，不会被单独拉取。
#
# ---------------------------------------------------------------------------
# 怎么用：删掉下方示例的「#」并改成你自己的域名，然后保存提交即可。
#          客户端在 24 小时内自动拉取（interval: 86400），也可以手动刷新规则集。
#
# 下面所有示例都用了 example.com / example.net —— 这是 RFC 2606 保留域名，
# 不对应任何真实网站，所以默认全注释掉不会误伤任何流量。
# ---------------------------------------------------------------------------

# ⚠️ 下面这行必须保持 `[]`，它代表「空列表」。
#    填规则时改成下面这样（注意缩进 2 空格，减号前有空格）：
#      payload:
#        - DOMAIN-SUFFIX,yoursite.com
payload: []

  # ---------------------------------------------------------------------
  # ① 域名后缀：匹配 example.com 及其所有子域名
  #    适合：整个站点（含所有子域）都该直连
  # ---------------------------------------------------------------------
  # - DOMAIN-SUFFIX,example.com

  # ---------------------------------------------------------------------
  # ② 域名精确匹配：只匹配这一个主机名，不含子域
  #    适合：只让某个 API 端点直连，站点其余部分仍走代理
  # ---------------------------------------------------------------------
  # - DOMAIN,api.example.net

  # ---------------------------------------------------------------------
  # ③ 关键字匹配：域名中「包含」该关键字即命中
  #    ⚠️ 杀伤力最大，容易误伤。优先用 ① ②，确有需要再用这个。
  # ---------------------------------------------------------------------
  # - DOMAIN-KEYWORD,intranet

  # ---------------------------------------------------------------------
  # ④ IP 段：匹配目标 IP
  #    no-resolve 表示「不为此规则触发 DNS 解析」，可减少 DNS 请求与泄漏面。
  #    ⚠️ 填公网 IP 前先确认：写错会静默失配，且换 IP 后规则立刻失效。
  # ---------------------------------------------------------------------
  # - IP-CIDR,203.0.113.0/24,no-resolve

  # ---------------------------------------------------------------------
  # ⑤ 进程匹配：只对指定程序的流量生效
  #    ⚠️ 仅在 Windows / macOS 桌面端有效，Android / iOS 不支持。
  #    ⚠️ 需客户端开启「查找进程」，且会明显增加 CPU 开销。
  # ---------------------------------------------------------------------
  # - PROCESS-NAME,MyPrivateApp.exe
