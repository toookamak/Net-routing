# OwnPROXYRules —— 个人自定义「走代理」规则
#
# 作用：命中这里的流量走策略组「📁 办公通讯」。
# 生效位置：见 rules/priorities.yaml 的 office 段 —— 排在「广告拦截」「Tailscale」
#          「国内直连」「应用级大流量」之后，但**早于**「AI 服务」「谷歌服务」
#          「CDN 大流量」「游戏平台」以及最后的兜底 MATCH。
#
# ⚠️ 正因为本段早于 cdn 段，这里的规则可以压过 CDN_no_ip / Download_no_ip
#    等大流量规则。往本文件加域名前，先想清楚是不是要抢在那些规则前面。
# 格式：YAML + payload 数组，一行一条 mihomo classical 规则。
#
# 📌 什么时候该往这里填？
#    当某个站点应该走代理、但你实测它没走对时，先查 mihomo 面板的「连接」页
#    看它最终命中了哪条规则。确认是「兜底走了代理但选错了组」时才需要加进来。
#    如果它已经被上游规则集正确分流了，**不要重复添加**。
#
# 💡 小提示
#    本目录随仓库一起公开。如果某条规则涉及不希望公开的信息（内网域名、
#    内部服务地址等），可以考虑把仓库改为 Private，或把该条规则改写到
#    rules/inline-rules.yaml —— 内嵌规则不依赖外部地址，不会被单独拉取。
#
# ---------------------------------------------------------------------------
# 怎么用：删掉下方示例的「#」并改成你自己的域名，然后保存提交即可。
#          客户端在 24 小时内自动拉取（interval: 86400），也可以手动刷新规则集。
#
# 下面所有示例都用了 example.com / example.net —— 这是 RFC 2606 保留域名，
# 不对应任何真实网站，所以默认全注释掉不会误伤任何流量。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 当前生效的规则
# ---------------------------------------------------------------------------

# linux.do 论坛主站及全部子域
payload:
  - DOMAIN-SUFFIX,linux.do

  # linux.do 的头像与静态资源 CDN
  #
  # ⚠️ 单独加这一条的原因（2026-10-02 排查 avatar 全部裂图）：
  #
  #    上游 RealSeek/Clash_Rule_DIY 的 CDN_no_ip 规则集里有
  #        DOMAIN-KEYWORD,ldstatic.com
  #    头像请求因此命中 cdn 段的 RULE-SET,CDN_no_ip,📺 大流量通道。
  #
  #    「大流量通道」默认 DIRECT，而 DIRECT 要求内核在本地解析出真实 IP。
  #    cdn.ldstatic.com 解析结果是 Cloudflare（104.26.x.x / 172.67.70.20），
  #    非国内 IP，于是触发 dns.fallback-filter 的 geoip-code: CN 判定，
  #    转而查询 fallback 里的 tls://8.8.4.4 / tls://1.1.1.1（DoT 853）。
  #    这两个源在大陆直连不可用，且 dns.respect-rules 为 false，查询不走代理，
  #    最终 5 秒超时 → dns resolve failed (context deadline exceeded) → 裂图。
  #
  #    本文件位于 office 段，早于 cdn 段，所以这里的规则优先级更高。
  #    连同主站一起放在「📁 办公通讯」，可保证论坛页面与头像走同一出口，
  #    不会出现「页面能开但图裂在另一个出口」的错配。
  - DOMAIN-SUFFIX,ldstatic.com

# ---------------------------------------------------------------------------
# 填写说明
# ---------------------------------------------------------------------------
# 往上面加规则时注意：`payload:` 后面第一行就要写列表项，不要留空行再缩进。
# 另外 `payload: []`（空列表）必须保留到你真的要开始填为止 ——
# 只写 `payload:` 不带 `[]` 会被解析成 null 而不是空数组，内核会拒绝加载。

  # ---------------------------------------------------------------------
  # ① 域名后缀：匹配 example.com 及其所有子域名
  #    适合：整个站点（含所有子域）都该走代理
  # ---------------------------------------------------------------------
  # - DOMAIN-SUFFIX,example.com

  # ---------------------------------------------------------------------
  # ② 域名精确匹配：只匹配这一个主机名，不含子域
  #    适合：只让某个 API 端点走代理，站点其余部分直连
  # ---------------------------------------------------------------------
  # - DOMAIN,api.example.net

  # ---------------------------------------------------------------------
  # ③ 关键字匹配：域名中「包含」该关键字即命中
  #    ⚠️ 杀伤力最大，容易误伤。优先用 ① ②，确有需要再用这个。
  # ---------------------------------------------------------------------
  # - DOMAIN-KEYWORD,analytics

  # ---------------------------------------------------------------------
  # ④ IP 段：匹配目标 IP
  #    no-resolve 表示「不为此规则触发 DNS 解析」，可减少 DNS 请求与泄漏面。
  #    ⚠️ 填公网 IP 前先确认：写错会静默失配，且换 IP 后规则立刻失效。
  # ---------------------------------------------------------------------
  # - IP-CIDR,198.51.100.0/24,no-resolve

  # ---------------------------------------------------------------------
  # ⑤ 进程匹配：只对指定程序的流量生效
  #    ⚠️ 仅在 Windows / macOS 桌面端有效，Android / iOS 不支持。
  #    ⚠️ 需客户端开启「查找进程」，且会明显增加 CPU 开销。
  # ---------------------------------------------------------------------
  # - PROCESS-NAME,SomeTool.exe
