# OwnREJECTRules —— 个人自定义「广告拦截」规则
#
# 作用：命中这里的流量交给策略组「⛔ 广告拦截」。
#          该组固定只有 [REJECT, DIRECT] 两项，默认选 REJECT，即直接掐断。
# 生效位置：见 rules/priorities.yaml 的 adblock 段 —— 排在「免拦截白名单」之后，
#          其余所有规则之前。优先级很高，白名单（UnBan）之外的都在它后面。
# 格式：YAML + payload 数组，一行一条 mihomo classical 规则。
#
# 📌 怎么找出该拦的？
#    打开 mihomo 面板 →「连接」页 → 找到广告请求 → 记下它的域名 →
#    写成 DOMAIN 或 DOMAIN-SUFFIX 加到这里。观察一两天，确认没误伤再留下。
#
# ⚠️ 拦截的代价
#    拦错域名 = 正常功能不可用且没有任何报错提示，只表现为「某功能打不开」。
#    建议一次只加一条，观察确认后再加下一条。
#
# 💡 小提示
#    本目录随仓库一起公开。如果某条规则涉及不希望公开的信息（内网域名、
#    内部服务地址等），可以考虑把仓库改为 Private，或把该条规则改写到
#    rules/inline-rules.yaml —— 内嵌规则不依赖外部地址，不会被单独拉取。
#
# ---------------------------------------------------------------------------
# 怎么用：删掉下方示例的「#」并改成你发现的广告域名，然后保存提交即可。
#          客户端在 24 小时内自动拉取（interval: 86400），也可以手动刷新规则集。
#
# 下面所有示例都用了 example.com / example.net —— 这是 RFC 2606 保留域名，
# 不对应任何真实网站，所以默认全注释掉不会误伤任何流量。
# ---------------------------------------------------------------------------

# ⚠️ 下面这行必须保持 `[]`，它代表「空列表」。
#    填规则时改成下面这样（注意缩进 2 空格，减号前有空格）：
#      payload:
#        - DOMAIN-SUFFIX,ads.yoursite.com
payload: []

  # ---------------------------------------------------------------------
  # ① 域名后缀：匹配 example.com 及其所有子域名
  #    适合：整个广告域名的所有子域（常见于同一广告平台的多条链路）
  # ---------------------------------------------------------------------
  # - DOMAIN-SUFFIX,ads.example.com

  # ---------------------------------------------------------------------
  # ② 域名精确匹配：只匹配这一个主机名
  #    适合：已确认只该拦这一个端点，域名的其他子域仍在正常使用
  # ---------------------------------------------------------------------
  # - DOMAIN,track.example.net

  # ---------------------------------------------------------------------
  # ③ 关键字匹配：域名中「包含」该关键字即命中
  #    ⚠️ 误伤风险最高。广告域名里带 "ad" 字样的同时也可能是正常业务，
  #       务必先用面板确认命中范围再决定要不要用这一条。
  # ---------------------------------------------------------------------
  # - DOMAIN-KEYWORD,doubleclick
