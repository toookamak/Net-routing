# 规则顺序与目标组
#
# mihomo 规则从上到下匹配，命中即停，**顺序即优先级**。
# 下面这个顺序是整个配置里最需要小心的部分。
#
# 关键约束：
#   1. UnBan / Direct 必须排在所有 REJECT 规则之前，否则白名单形同虚设
#   2. Tailscale 必须排在 GEOSITE,cn 与 GEOIP,CN 之前，
#      否则内网 IP 会被「国内直连」或兜底规则先抢走
#   3. GEOIP,CN 与 MATCH 必须留在最后两条

- id: unban
  comment: 免拦截白名单 + 全球直连修正。必须最先。
  group: DIRECT
  rules:
    - UnBan
    - DirectNoResolve

- id: adblock
  comment: 广告拦截。放在直连修正之后。
  group: "⛔ 广告拦截"
  rules:
    - Reject_no_ip
    - Reject_domainset
    - Reject_no_ip_drop
    - Reject_no_ip_no_drop
    - Reject_ip
    - CustomRejectRules

- id: tailscale
  comment: >-
    Tailscale 内网与服务端域名。必须早于 GEOSITE,cn 与 GEOIP,CN。
    后两条是 tailscale.com / tailscale.io —— 协调 controlplane、登录 login、
    DERP 中继 derpN、软件源 pkgs、遥测 log 都在其下。不直连时它们落兜底代理，
    DERP 中继被选到境外，访问家里设备就得绕路。
    ⚠️ 两端在此有意分叉：OpenClash 产物把整段硬写成 DIRECT（见
    targets/openclash-override-1002.conf 段 3）；FlClash 产物仍按「🔗 Tailscale」
    组走（该组默认 DIRECT）。改这里不会自动同步到两个产物。
    ⚠️ 当前的实际差异：OpenClash 产物在段 3 另有第 9 条
    PROCESS-NAME,tailscaled,DIRECT（进程规则只对路由器自身有效，FlClash 不需要，
    因为客户端上进程规则命中的就是本机进程）。该条依赖覆写文件的
    [General] FIND_PROCESS_MODE=strict，规则集表达不了，所以留在 conf 里。
    ⚠️ 上面 tailscale.com / tailscale.io 两条域名**不再写进任何产物**，而是落在
    rulesets/OwnDIRECTRules.yaml —— 两个产物都经 CustomDirectRules（OpenClash
    第 21 条、FlClash 第 21 条）命中，位置在各自「国内直连」段之后；因为那一段
    的目标本来就全是 DIRECT，功能等价，不需要为顺序挪动。
    ⚠️ conf 另有第 51 条（段 11）
    AND,((NETWORK,udp),(SRC-IP-CIDR,192.168.31.7/32)),DIRECT —— 给 LAN 上那台常用
    终端放行整机 UDP 打洞（目标 IP/端口都不固定，抓不全）。它按「来源 IP」而不是
    进程匹配，且规则集 payload 只支持单条规则、表达不了 AND 逻辑规则，所以同样
    留在 conf 里，与上面的顺序无关。
  group: "🔗 Tailscale"
  rules:
    - "IP-CIDR,100.64.0.0/10,no-resolve"
    - "IP-CIDR,100.100.100.100/32,no-resolve"
    - "DOMAIN-SUFFIX,ts.net"
    - "DOMAIN-SUFFIX,tailscale.com"
    - "DOMAIN-SUFFIX,tailscale.io"

- id: direct
  comment: 私有网络 + 国内备案 CDN + 国内直连
  group: DIRECT
  rules:
    - "GEOSITE,private"
    - "GEOIP,private,no-resolve"
    - MicrosoftCNCDN_no_ip
    - AppleCNCDN_no_ip
    - "GEOSITE,cn"
    - Lan_ip
    - SteamCN_ip
    - Domestic_no_ip

- id: traffic
  comment: 应用级规则（按进程名匹配）
  group: "📺 大流量通道"
  rules: [applications]

- id: custom-direct
  comment: 用户自定义直连，锁死 DIRECT，不建组
  rules:
    - provider: CustomDirectRules
      group: DIRECT

- id: office
  comment: 办公通讯 + 微软 + 开发工具链（Docker / npm）+ 自定义代理
  group: "📁 办公通讯"
  rules:
    - Figma_ip
    - Notion_ip
    # v1.0.1 新增：X / Twitter → 📁 办公通讯
    - Twitter
    - Github
    - OneDrive
    - Dropbox
    - Telegram_ip
    - Telegram_no_ip
    - Microsoft_no_ip
    - Docker
    - Npm
    - provider: CustomProxyRules
      group: "📁 办公通讯"

- id: ai
  group: "🤖 AI服务"
  rules: [OpenAI, AI_no_ip, Gemini]

- id: google
  group: "🔍 谷歌服务"
  rules: [YouTube, GoogleFCM_ip, Google, GoogleFCM_no_ip]

- id: cdn
  comment: 下载 / CDN / 流媒体大流量
  group: "📺 大流量通道"
  rules:
    - MicrosoftCDN_no_ip
    - CDN_domainset
    - CDN_no_ip
    - Download_domainset
    - Download_no_ip
    - GameDownload
    - Stream_ip

- id: game
  group: "游戏平台"
  rules: [UnrealRules, Steam, Origin, Sony, Nintendo]

- id: geoip
  comment: 国内 IP 兜底
  group: "🛡️ 国内直连"
  rules: ["GEOIP,CN"]

- id: final
  comment: 兜底
  group: "🌍 兜底代理"
  rules: [MATCH]
