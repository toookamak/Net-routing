#   name: "🇩🇪 德国"
#   icon: Germany.png
#   filter: "德国|DE|Germany|法兰克福|🇩🇪"
#
# ⚠️ 保持注释的原因：实测订阅里没有这两个地区的节点，
#    取消注释会在面板上多出两个永远空转的组。
#    等真换到有韩国/德国节点的订阅时再开。
#
# ⚠️ 地区组一律不写 exclude-filter。
#    实测：排掉「低倍率」会让美国(12→0)、英国(4→0)整组消失，
#    排掉「流媒体」会让台湾(1→0)消失。详见 docs/openclash.md 第五节 11。
