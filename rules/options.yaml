# 运行时可调参数
#
# 这些是「开关」，改这里不用动结构。README 里会指明常用项的位置。

network:
  ipv6: false
  comment: |
    封死 IPv6 泄露。
    仅设 ipv6:false 不足以封堵——系统自带 IPv6 路由会绕过 TUN 直连，
    流量根本不进 mihomo。必须配合 tun.inet6_route_address 让 TUN
    接管全球单播段并丢弃，浏览器才会回退 IPv4 走代理。
    ChatGPT / HuggingFace 等均为双栈，走 IPv4 不受影响。

tun:
  mtu: 1400
  stack: mixed
  dns_hijack: ["any:53"]
  inet6_route_address: ["2000::/3"]
  strict_route: false
  comment: |
    mtu 1400 而非 1500：降低大包被丢弃的概率，减少网页卡顿与下载断流。
    inet6_route_address 是防 IPv6 泄露的关键项，勿删。

speedtest:
  interval: 1800
  comment: |
    测速间隔（秒）。600(10min) → 1800(30min) 后理论请求量降至 1/3。
    配合各自动组的 lazy:true，未被选中的组完全不发起测速。
  lazy: true

provider_update:
  default_interval: 172800
  custom_interval: 86400
  comment: 规则集更新间隔（秒）。172800 = 48 小时，86400 = 24 小时

tailscale:
  enabled: true
  hostname: flclash-device
  accept_routes: true
  udp: false
  state_dir: ./tailscale
  comment: |
    需要 mihomo >= v1.19.25（FlClash >= 0.8.93 打包该内核）。
    多设备（电脑 + 手机）跑同一份脚本时，hostname 必须改成不同名字，
    否则 tailnet 内会重名。
    auth-key 默认不填：留空时 mihomo 在日志输出交互式登录 URL，
    点开授权即可，避免密钥随 FlClash 备份文件泄露。
    若要免交互登录，在渲染器输出的节点上追加 "auth-key" 字段，
    建议用一次性 key（用完即废）。
