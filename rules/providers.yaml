# 规则集来源定义
#
# net-routing 核心资产之一：所有第三方规则集的地址与元数据。
# 换源、改格式、调更新间隔都只动这个文件，不影响任何渲染器。
#
# behavior —— mihomo 的匹配方式
#   domain     纯域名列表，trie 匹配，最省内存
#   ipcidr     纯 IP 段
#   classical  混合格式，支持 DOMAIN / IP-CIDR / PROCESS-NAME
#
# format —— 文件解析方式
#   text       一行一条规则（ACL4SSR / Sukka 常用）
#   yaml       payload 数组（blackmatrix7 常用）
#   ⚠️ 声明与文件实际格式不符，provider 会静默空载且不报错
#
# interval —— 更新间隔（秒），172800 = 48 小时


# ---------------------------------------------------------------- 直连 / 免拦截

  Lan_ip:
    url: "https://raw.githubusercontent.com/RealSeek/Clash_Rule_DIY/refs/heads/mihomo/DIRECT/ip/Lan_ip.yaml"
    path: "./ruleset/toookamak/Lan_ip.yaml"
    format: "yaml"
    behavior: "classical"
    interval: 172800
  Domestic_no_ip:
    url: "https://raw.githubusercontent.com/RealSeek/Clash_Rule_DIY/refs/heads/mihomo/DIRECT/no_ip/Domestic_no_ip.yaml"
