# 节点特征匹配
#
# 决定节点被归入哪个「特性组」以及是否被剔除。
#
# ⚠️ 写法与 regions.yaml 一致：只用简短文字，不要特殊符号。
#    「家宽」两个字各家的原生/家宽线路都写，「:」只有一家写。

notification:
  comment: |
    通知节点 —— 机场的流量/到期提示。这些节点会被排除出「全部节点」，
    只保留在「📢 订阅信息」组里。
    宽版本含裸的「年」「月」等单字，会误杀正常线路节点；
    收窄版本用「年付/月付」等组合词，误杀更少。
  broad: "自动|故障|流量|官网|套餐|机场|订阅|年|月|失联|频道|Traffic|Expire|剩余|过期|激励|分享|到期|续费|充值"
  strict: "自动|故障|流量|官网|套餐|机场|订阅|年付|月付|失联|频道|Traffic|Expire|剩余|过期|激励|分享|到期|续费|充值"
  use_strict: true
  note: |
    ⚠️ 这份是 FlClash 端用的，可以写多个词（JS 正则不受 OpenClash 限制）。
    路由器端因为 OpenClash 逐行 eval 只能给一个词，选的是「剩余」——
    它对「剩余流量：/剩余天数：/距离下次重置剩余：」三种常见写法都命中，
    且不会误伤真实线路名。详见 openclash-override-1002.conf 的 exclude-filter。

residential:
  comment: 家宽 / 原生 IP 线路
  filter: "家宽|原生|住宅|residential|home"

lowrate:
  comment: |
    低倍率节点（按流量倍率计费便宜的）—— 只覆盖中文/英文写法。
    ⚠️ 数字倍率写法不在本键内，见 lowrate_numeric。
    ⚠️ 本键在 flclash 产物里还兼职「把命中节点排除出所有地区组」，
       所以**绝不能**把数字倍率并进来（实测会让美国 12→0、英国 4→0 整组消失）。
  filter: "低倍率|倍率|lowrate"

lowrate_numeric:
  comment: |
    数字倍率写法。2026-10-02 实测：某订阅 51 个节点里 lowrate 命中 **0 个**，
    因为节点用的是 `|0.5x` `|0.1x` `|0.01x` 这种记法，不含「倍率」二字。
    扩充后同一批节点命中 18 个。这是通用缺口，不是某个机场的特殊命名。

    ⚠️ 为什么不直接并进 lowrate：
       flclash 产物用 lowrate 同时干两件事 —— ①建「💰 低倍率节点」特性组
       ②把命中节点排除出所有地区组（见 docs/design.md 已知问题 2）。
       并入数字倍率会让 ②把大部分地区组清空（实测：美国 12→0、英国 4→0）。
       路由器版地区组不设 exclude-filter（见 docs/openclash.md 第五节 11），
       所以能安全引用本键。两端由各自渲染器决定引哪个，不要合并。
  filter: "0\\.\\d+x|[0-9]+倍"
  note: |
    这是全套过滤里**唯一保留的正则写法**，因为 `0.5x` 这种记法没有任何一个
    词能概括它。其余过滤器都已改成纯文字。路由器端用它（单正则），
    代价是认不出「低倍率」中文写法 —— 换订阅后两者命中率此消彼长，
    用 tools/check-node-match.mjs 对新节点名核一次即可。

streaming:
  comment: |
    流媒体 / 解锁节点。2026-10-02 新增。
    中文机场普遍用「流媒体」标注解锁专用节点，这类节点常带极低倍率（0.01x），
    单独成组便于「想看 Netflix 就切过去」，不污染日常地区组。
  filter: "流媒体|解锁|Netflix|Disney|IPLC|IEPL"
